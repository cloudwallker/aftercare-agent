name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run python scripts/check_release.py
      - run: docker compose -p aftercare-test -f compose.yaml -f compose.test.yaml run --rm --build tests
      - if: always()
        run: docker compose -p aftercare-test -f compose.yaml -f compose.test.yaml down
